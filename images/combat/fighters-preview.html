<!doctype html><html lang="ru"><meta charset="utf-8"><base href="../../"><title>Боковой бой — проверка земли</title><style>body{margin:0;background:#20251f;color:#eee;font:18px sans-serif}header{display:flex;justify-content:space-around;padding:16px}canvas{width:100%;display:block}.combat-caption{padding:12px;text-align:center}</style><header><span>Игрок слева →</span><select id="stage" aria-label="Фон боя"></select><span>← Враг справа</span></header><div id="combatScene" hidden></div><script src="images/combat/catalog.js"></script><script src="images/combat/assets.js"></script><script src="images/combat/layout.js"></script><script src="images/combat/backgrounds.js"></script><script src="images/combat/fighters.js"></script><script src="images/combat/scene.js"></script><script>const select=document.getElementById('stage');for(const stage of CombatBackgrounds.entries){const option=document.createElement('option');option.value=stage.id;option.textContent=stage.id;select.append(option);}let serial=0;async function preview(){const selected=CombatBackgrounds.entries.find(x=>x.id===select.value);CombatBackgrounds.resolve=()=>selected;await CombatScene.show({enemy:{name:'Противник',hp:100,battleToken:'preview-'+(++serial)},armor:1,weaponId:12,enemyGear:{armorId:40,weaponId:12},playerLevel:selected.minLevel});}select.onchange=preview;preview();</script></html>
