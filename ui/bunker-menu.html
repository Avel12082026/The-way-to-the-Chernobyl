<!-- Cordon rookie camp. Coordinates use the approved 941 x 1672 artwork. -->
<div id="mainMenu" class="bunker-menu" aria-label="Кордон — лагерь сталкеров">
  <div id="bunkerScene" class="bunker-scene">
    <img id="bunkerArtwork" class="bunker-artwork" src="ui/cordon-zhuchara-camp.png?v=20260927-cordon-zhuchara1" width="941" height="1672" alt="Кордон: подвальный лагерь новичков с Жучарой, дверью Выход и дверью Склад" draggable="false" fetchpriority="high" />
    <img id="bunkerLowerHud" class="cordon-lower-hud-artwork" src="ui/rostok-lower-hud.png?v=09db18421007" width="941" height="182" alt="" aria-hidden="true" draggable="false" />
    <nav class="bunker-hotspots" aria-label="Разделы лагеря">
      <button id="bunkerRaid" class="bunker-hotspot" data-bunker-target="raid" type="button" aria-label="Выход на карту Кордона" onclick="BunkerMenu.enterRaid()" style="left:0%;top:27%;width:25%;height:38%"></button>
      <button id="bunkerZhuchara" class="bunker-hotspot" data-bunker-target="shop" type="button" aria-label="Торговец Жучара" onclick="openScreen('shop')" style="left:25%;top:23%;width:50%;height:34%"></button>
      <button id="bunkerWarehouse" class="bunker-hotspot" data-bunker-target="warehouse" type="button" aria-label="Склад" onclick="openScreen('warehouse')" style="left:75%;top:27%;width:25%;height:38%"></button>
      <button id="bunkerInventory" class="bunker-hotspot" data-bunker-target="inventory" type="button" aria-label="Инвентарь" onclick="openScreen('inventory')" style="left:70%;top:90.4%;width:13.9%;height:7.8%"></button>
      <button id="bunkerPda" class="bunker-hotspot" data-bunker-target="kpk" type="button" aria-label="КПК" onclick="openScreen('kpk')" style="left:84.1%;top:90.4%;width:13.7%;height:7.8%"></button>
    </nav>
    <div class="bunker-progress-row" aria-label="Опыт и радиация">
      <div id="bunkerExperience" class="bunker-progress" role="progressbar" aria-label="Опыт" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="expBarFill" class="expBarFill bunker-progress-fill"></div><span id="bunkerExperienceText" class="bunker-progress-text">Опыт: 0</span></div>
      <div id="bunkerRadiation" class="bunker-progress" role="progressbar" aria-label="Радиация" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="mainRadiationBarFill" class="radiationBarFill bunker-progress-fill"></div><span id="bunkerRadiationText" class="bunker-progress-text">Радиация: 0 / 100</span></div>
    </div>
    <div id="bunkerHunger" class="bunker-vital bunker-hunger" role="progressbar" aria-label="Сытость" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bunker-vital-fill"></div><span class="bunker-vital-text"><span id="hunger">0</span><span id="bunkerHungerMax"> / 100</span></span></div>
    <div id="bunkerThirst" class="bunker-vital bunker-thirst" role="progressbar" aria-label="Жажда" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bunker-vital-fill"></div><span class="bunker-vital-text"><span id="thirst">0</span><span id="bunkerThirstMax"> / 100</span></span></div>
    <div id="bunkerHealth" class="bunker-vital bunker-health" role="progressbar" aria-label="Здоровье" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bunker-vital-fill"></div><span class="bunker-vital-text"><span id="health">0</span><span id="bunkerHealthMax"> / 100</span></span></div>
    <section class="bunker-resources" aria-label="Ресурсы персонажа">
      <div class="bunker-resource"><span>Сталбайты</span><span id="coins">0</span></div>
      <div class="bunker-resource"><span>Сталкоины</span><span id="breedCreditsHeader">0</span></div>
      <div class="bunker-resource"><span>Опыт+</span><span id="knowledgeBooksHeader">0</span></div>
    </section>
    <button id="bunkerReadBook" class="bunker-read-book" type="button" onclick="BunkerMenu.readBook()" aria-label="Использовать Опыт+">Использовать</button>
    <p id="bunkerMessage" class="bunker-message" role="status" hidden></p>
    <!-- Preserve legacy updateUI/profile targets; these do not occupy layout space. -->
    <div hidden aria-hidden="true"><span id="level">1</span><span id="nicknameCreditsHeader">0</span><span id="zrPlayerName"></span><span id="zrPlayerFaction"></span></div>
  </div>
</div>
