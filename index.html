<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Zone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #ddd; padding: 10px; min-height: 100vh; }
        .header { background: #1a1a1a; border: 2px solid #333; padding: 12px; margin-bottom: 12px; border-radius: 4px; text-align: center; }
        .header h1 { color: #8a7a4a; font-size: 20px; letter-spacing: 2px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .stat-box { background: #111; border: 1px solid #2a2a2a; padding: 6px; font-size: 12px; color: #aaa; text-align: center; border-radius: 4px; }
        .stat-box .value { display: block; font-size: 18px; font-weight: bold; color: #fff; }
        .stat-box.health .value { color: #ff5e5e; }
        .stat-box.hunger .value { color: #e6a23c; }
        .stat-box.thirst .value { color: #3c8de6; }
        .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .menu button { padding: 18px; background: #1a1a1a; border: 2px solid #333; border-radius: 8px; color: #ddd; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .menu button:active { transform: scale(0.96); background: #222; }
        .screen { display: none; background: #111; border: 2px solid #2a2a2a; padding: 12px; border-radius: 4px; margin-bottom: 12px; }
        .screen.active { display: block; }
        .back-btn { margin-top: 15px; width: 100%; padding: 12px; background: #c0392b; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="loading" style="text-align: center; padding: 50px; font-size: 20px;">Загрузка...</div>

<div id="app" style="display: none;">
    <div class="header">
        <h1>POCKET ZONE</h1>
        <div class="stats-grid">
            <div class="stat-box health">❤️ <span class="value" id="health">100</span></div>
            <div class="stat-box hunger">🍖 <span class="value" id="hunger">100</span></div>
            <div class="stat-box thirst">💧 <span class="value" id="thirst">100</span></div>
        </div>
        <div style="margin-top: 6px; font-size: 12px; color: #888;">
            🪙 <span id="coins">0</span> | ⭐ <span id="level">1</span> | ⚔️ <span id="weapon">Кулаки</span>
        </div>
    </div>

    <div id="mainMenu" class="menu">
        <button onclick="openScreen('inventory')">🎒 Инвентарь</button>
        <button onclick="openScreen('shop')">💰 Торговец</button>
        <button onclick="startRaid()">⚔️ В Рейд</button>
        <button onclick="openScreen('warehouse')">🏠 Мой склад</button>
        <button onclick="openScreen('detectors')">📡 Детекторы</button>
        <button onclick="openScreen('kpk')">📱 КПК</button>
        <button onclick="openScreen('market')">🏦 Рынок</button>
        <button onclick="openScreen('arena')">🏟️ Арена</button>
        <button onclick="exitGame()">🚪 Выйти из игры</button>
    </div>

    <div id="inventoryScreen" class="screen">
        <h3>🎒 Инвентарь</h3>
        <button class="back-btn" onclick="openScreen('main')">Назад</button>
    </div>

    <div id="shopScreen" class="screen">
        <h3>💰 Торговец</h3>
        <button class="back-btn" onclick="openScreen('main')">Назад</button>
    </div>

    <div id="warehouseScreen" class="screen">
        <h3>🏠 Мой склад</h3>
        <button class="back-btn" onclick="openScreen('main')">Назад</button>
    </div>

    <div id="detectorsScreen" class="screen">
        <h3>📡 Детекторы</h3>
        <button class="back-btn" onclick="openScreen('main')">Назад</button>
    </div>

    <div id="kpkScreen" class="screen">
        <h3>📱 КПК</h3>
        <button class="back-btn" onclick="openScreen('main')">Назад</button>
    </div>

    <div id="marketScreen" class="screen">
        <h3>🏦 Рынок</h3>
        <button class="back-btn" onclick="openScreen('main')">Назад</button>
    </div>

    <div id="arenaScreen" class="screen">
        <h3>🏟️ Арена</h3>
        <button class="back-btn" onclick="openScreen('main')">Назад</button>
    </div>

    <div id="raidScreen" class="screen">
        <h3>⚔️ Рейд</h3>
        <div class="log" id="raidLog">Нажмите "Идти дальше"</div>
        <button class="back-btn" onclick="endRaid()">Вернуться с рейда</button>
    </div>

</div>

<script>
    let player = {
        health: 100, hunger: 100, thirst: 100, coins: 0, level: 1, exp: 0,
        vitality: 0, agility: 0, strength: 0, accuracy: 0, intellect: 0, luck: 0,
        weapon: { name: 'Кулаки', tier: 0, dmg: 5 },
        armor: { name: 'Нет', tier: 0, armor: 0, artifactProtection: 0 },
        detector: { name: 'Радэр 2-02', tier: 1 },
        maxHealth: 100,
        inventory: {},
        belt: [null, null, null, null, null, null],
        warehouse: {},
        quickSlots: [null, null, null, null]
    };

    let raidActive = false;
    let raidLogs = [];
    let currentEnemy = null;
    let battleTurn = 0;

    // ===== ПОДКЛЮЧЕНИЕ К СЕРВЕРУ =====
    const SERVER_URL = 'http://213.176.92.184:3000';

    function saveGame() {
        const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
        const userId = tgUser ? tgUser.id : 'guest';
        
        fetch(`${SERVER_URL}/api/player`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: userId, username: tgUser?.username, data: player })
        });
    }

    function loadGame() {
        const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
        const userId = tgUser ? tgUser.id : 'guest';
        
        fetch(`${SERVER_URL}/api/player/${userId}`)
            .then(res => res.json())
            .then(data => {
                if (data) { Object.assign(player, data); }
                updateUI();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            })
            .catch(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            });
    }

    function updateUI() {
        document.getElementById('health').textContent = Math.round(player.health);
        document.getElementById('hunger').textContent = Math.round(player.hunger);
        document.getElementById('thirst').textContent = Math.round(player.thirst);
        document.getElementById('coins').textContent = player.coins;
        document.getElementById('level').textContent = player.level;
        document.getElementById('weapon').textContent = player.weapon.name;
    }

    // ===== НАВИГАЦИЯ =====
    function openScreen(screen) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('mainMenu').style.display = 'none';
        
        if (screen === 'main') {
            document.getElementById('mainMenu').style.display = 'grid';
            return;
        }
        
        const target = document.getElementById(screen + 'Screen');
        if (target) {
            target.classList.add('active');
        }
    }

    // ===== РЕЙД =====
    function startRaid() {
        raidActive = true;
        raidLogs = [];
        document.getElementById('mainMenu').style.display = 'none';
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('raidScreen').classList.add('active');
        document.getElementById('raidLog').textContent = 'Вы входите в Зону...';
        saveGame();
    }

    function endRaid() {
        raidActive = false;
        openScreen('main');
        saveGame();
    }

    function raidStep() {
        if (!raidActive) return;
        
        const npcChance = Math.random();
        
        if (npcChance < 0.3) {
            const anomaly = anomalies[Math.floor(Math.random() * anomalies.length)];
            const dmg = anomaly.dmg - player.armor.armor - player.armor.artifactProtection;
            const finalDmg = Math.max(0, dmg);
            
            player.health -= finalDmg;
            
            let eventText = `Аномалия ${anomaly.name}! -${finalDmg} HP`;
            
            if (player.detector.tier >= anomaly.tier) {
                if (Math.random() < 0.5 + player.luck * 0.01) {
                    const artifactName = anomaly.artifacts[Math.floor(Math.random() * anomaly.artifacts.length)];
                    player.inventory[artifactName] = (player.inventory[artifactName] || 0) + 1;
                    eventText += `\nВы нашли артефакт: ${artifactName}!`;
                    player.luck += 0.1 * anomaly.tier;
                }
            } else {
                eventText += `\nДетектор слабоват для этого тира!`;
            }
            
            raidLogs.push(eventText);
        } else {
            raidLogs.push('🌫️ Вы ничего не нашли. Тишина...');
        }
        
        if (raidLogs.length > 3) raidLogs.shift();
        
        player.health = Math.max(0, Math.min(player.maxHealth, player.health));
        player.hunger = Math.max(0, Math.min(100, player.hunger));
        player.thirst = Math.max(0, Math.min(100, player.thirst));
        
        while (player.exp >= 150) {
            player.level += 1;
            player.exp = player.exp - 150;
        }
        
        updateUI();
        saveGame();
    }

    // ===== ВЫХОД ИЗ ИГРЫ =====
    function exitGame() {
        if (confirm('Вы уверены, что хотите выйти?')) {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.close();
            } else {
                alert('Игра сохранена!');
            }
        }
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    loadGame();
</script>
</body>
</html>
