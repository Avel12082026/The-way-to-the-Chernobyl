<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Zone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #ddd; padding: 10px; min-height: 100vh; }
        .header { background: #1a1a1a; border: 2px solid #333; padding: 12px; margin-bottom: 12px; border-radius: 4px; text-align: center; }
        .header h1 { color: #8a7a4a; font-size: 20px; letter-spacing: 2px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .stat-box { background: #111; border: 1px solid #2a2a2a; padding: 6px; font-size: 12px; color: #aaa; text-align: center; border-radius: 4px; }
        .stat-box .value { display: block; font-size: 18px; font-weight: bold; color: #fff; }
        .stat-box.health .value { color: #ff5e5e; }
        .stat-box.hunger .value { color: #e6a23c; }
        .stat-box.thirst .value { color: #3c8de6; }
        .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .menu button { padding: 18px; background: #1a1a1a; border: 2px solid #333; border-radius: 8px; color: #ddd; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .menu button:active { transform: scale(0.96); background: #222; }
        .screen { display: none; background: #111; border: 2px solid #2a2a2a; padding: 12px; border-radius: 4px; margin-bottom: 12px; }
        .screen.active { display: block; }
        .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .slot { background: #0d0d0d; border: 1px solid #222; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }
        .slot:hover { border-color: #8a7a4a; }
        .belt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .belt-slot { background: #0d0d0d; border: 2px solid #8a7a4a; padding: 8px; text-align: center; font-size: 12px; font-weight: bold; cursor: pointer; }
        .back-btn { margin-top: 15px; width: 100%; padding: 12px; background: #c0392b; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
        .log { background: #0d0d0d; padding: 10px; border: 1px solid #222; font-family: monospace; font-size: 12px; min-height: 100px; }
        .stats-details { margin-top: 10px; font-size: 12px; }
        .stats-details div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1a1a1a; }
        .shop-item { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 10px; margin-bottom: 6px; }
        .shop-item div { font-size: 14px; font-weight: bold; }
        .shop-item .price { color: #e6a23c; font-size: 12px; }
        .shop-item button { margin-top: 4px; padding: 6px 12px; background: #27ae60; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; }
        .shop-item button:disabled { opacity: 0.4; cursor: not-allowed; }
        .admin-btn { position: fixed; bottom: 10px; left: 10px; padding: 8px 16px; background: transparent; border: none; border-radius: 8px; color: transparent; font-weight: bold; font-size: 14px; z-index: 999; cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; padding: 30px; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a1a; border: 2px solid #e6a23c; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; }
        .modal-content h3 { color: #e6a23c; margin-bottom: 15px; }
        .modal-content input { width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; margin-bottom: 10px; border-radius: 6px; }
        .modal-content button { width: 100%; padding: 10px; background: #27ae60; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
        .quick-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .quick-slot { background: #0d0d0d; border: 1px solid #333; padding: 8px; text-align: center; font-size: 12px; font-weight: bold; cursor: pointer; }
        .quick-slot:hover { border-color: #8a7a4a; }

</head>

<div id="loading" style="text-align: center; padding: 50px; font-size: 20px;">Загрузка...</div>

        <button onclick="openScreen('arena')">🏟️ Арена</button>

        <div id="warehouseScreen" class="screen">

    <div id="detectorsScreen" class="screen">

    <div id="raidScreen" class="screen">

        <div class="log" id="raidLog">Нажмите "Идти дальше"</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px;">

            <button onclick="endRaid()" style="background: #c0392b; border: none; padding: 12px; color: #fff; font-weight: bold; border-radius: 8px;">Вернуться с рейда</button>
        </div>
        <div class="quick-slots" id="quickSlots">
            <div class="quick-slot" onclick="useQuickSlot(0)">Пусто</div>
            <div class="quick-slot" onclick="useQuickSlot(1)">Пусто</div>
            <div class="quick-slot" onclick="useQuickSlot(2)">Пусто</div>
            <div class="quick-slot" onclick="useQuickSlot(3)">Пусто</div>
        </div>
    </div>

    <div id="kpkScreen" class="screen">

    <div id="marketScreen" class="screen">

        <button onclick="openMarketTab('buy')">Купить</button>

    </div>

    <div id="arenaScreen" class="screen">
        <h3>🏟️ Арена</h3>
        <button class="back-btn" onclick="openScreen('main')">Назад</button>

</div>

<div id="adminModal" class="modal">

for (let i = 0; i < factions.length; i++) {
    for (let tier = 1; tier <= 10; tier++) {
        const weapon = weapons.find(w => w.tier === tier) || weapons[0];
        const armor = armorItems.find(a => a.tier === tier) || armorItems[0];
        npcs.push({
            id: `${factions[i].name}_${tier}`,
            faction: factions[i],
            tier: tier,
            name: `${factions[i].name} ${tier} ур.`,
            weapon: weapon,
            armor: armor,
            coins: tier * 500,
            exp: tier * 50,
            hp: tier * 100,
            dmg: tier * 15,
            hitChance: 0.9,
            runChance: 0.5,
            runSkill: 0
        });
    }
}
// ===== ПОДКЛЮЧЕНИЕ К СЕРВЕРУ =====
const SERVER_URL = 'http://213.176.92.184:3000';

function saveGame() {
    const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
    const userId = tgUser ? tgUser.id : 'guest';
    
    fetch(`${SERVER_URL}/api/player`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: userId, username: tgUser?.username, data: player })
    });
}

function loadGame() {
    const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
    const userId = tgUser ? tgUser.id : 'guest';
    
    fetch(`${SERVER_URL}/api/player/${userId}`)
        .then(res => res.json())
        .then(data => {
            if (data) { Object.assign(player, data); }
            updateUI();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        })
        .catch(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        });
}

function updateUI() {
    document.getElementById('health').textContent = Math.round(player.health);
    document.getElementById('hunger').textContent = Math.round(player.hunger);
    document.getElementById('thirst').textContent = Math.round(player.thirst);
    document.getElementById('coins').textContent = player.coins;
    document.getElementById('level').textContent = player.level;
    document.getElementById('weapon').textContent = player.weapon.name;
    document.getElementById('detector').textContent = player.detector.name;
    document.getElementById('detectorTier').textContent = 'Тир ' + player.detector.tier;
}

// ===== АДМИН МЕНЮ =====
const ADMIN_PASSWORD = 'admin123';

function adminClickCounter() {
    adminClickCount++;
    if (adminClickCount >= 10) {
        adminClickCount = 0;
        openAdminModal();
    }
}

function openAdminModal() {
    document.getElementById('adminModal').classList.add('active');
}

function checkAdminPassword() {
    const password = document.getElementById('adminPassword').value;
    if (password === ADMIN_PASSWORD) {
        document.getElementById('adminModal').classList.remove('active');
        document.getElementById('adminPanel').classList.add('active');
    } else {
        alert('Неверный пароль!');
    }
}

function closeAdminPanel() {
    document.getElementById('adminPanel').classList.remove('active');
}

function giveAdminItem() {
    const type = document.getElementById('giveType').value;
    const amount = parseInt(document.getElementById('giveAmount').value) || 1;
    const tier = parseInt(document.getElementById('giveTier').value) || 1;
    const targetId = document.getElementById('targetUserId').value;
    const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
    const adminId = tgUser ? tgUser.id : 'guest';
    
    if (targetId) {
        let itemName = '';
        if (type === 'level') {
            itemName = 'level';
        } else if (type === 'coins') {
            itemName = 'coins';
        } else if (type === 'artifact') {
            const artifact = artifacts.find(a => a.tier === tier);
            if (artifact) itemName = artifact.name;
        } else if (type === 'weapon') {
            const weapon = weapons.find(w => w.tier === tier);
            if (weapon) itemName = weapon.name;
        } else if (type === 'armor') {
            const armor = armorItems.find(a => a.tier === tier);
            if (armor) itemName = armor.name;
        } else if (type === 'detector') {
            const detector = detectors.find(d => d.tier === tier);
            if (detector) itemName = detector.name;
        }
        
        fetch(`${SERVER_URL}/api/admin/give`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminId, targetId, item: itemName, amount })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert('Выдача выполнена!');
            } else {
                alert('Ошибка: ' + data.error);
            }
        });
    } else {
        if (type === 'level') {
            player.level += amount;
        } else if (type === 'coins') {
            player.coins += amount;
        } else if (type === 'artifact') {
            const artifact = artifacts.find(a => a.tier === tier);
            if (artifact) {
                player.inventory[artifact.name] = (player.inventory[artifact.name] || 0) + 1;
            }
        } else if (type === 'weapon') {
            const weapon = weapons.find(w => w.tier === tier);
            if (weapon) {
                player.inventory[weapon.name] = (player.inventory[weapon.name] || 0) + 1;
            }
        } else if (type === 'armor') {
            const armor = armorItems.find(a => a.tier === tier);
            if (armor) {
                player.inventory[armor.name] = (player.inventory[armor.name] || 0) + 1;
            }
        } else if (type === 'detector') {
            const detector = detectors.find(d => d.tier === tier);
            if (detector) {
                player.detector = detector;
            }
        }
        
        updateUI();
        saveGame();
        alert('Выдача выполнена!');
    }
    
    closeAdminPanel();
}
// ===== НАВИГАЦИЯ =====
function openScreen(screen) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById('mainMenu').style.display = 'none';
    
    if (screen === 'main') {
        document.getElementById('mainMenu').style.display = 'grid';
        return;
    }
    
    const target = document.getElementById(screen + 'Screen');
    if (target) {
        target.classList.add('active');
        if (screen === 'inventory') renderInventory();
        if (screen === 'shop') renderShop();
        if (screen === 'warehouse') renderWarehouse();
        if (screen === 'detectors') renderDetectors();
        if (screen === 'kpk') renderKpk();
        if (screen === 'market') renderMarket();
        if (screen === 'arena') renderArena();
    }
}

// ===== КПК =====

    const content = document.getElementById('kpkContent');
    content.innerHTML = '';
    
    if (kpkTab === 'info') {
        const stats = player.stats;

            <div style="background: #1a1a1a; padding: 15px; border-radius: 10px;">
                <h4>Инфо о персонаже</h4>
                <p>Уровень: ${player.level}</p>
                <p>Опыт: ${player.exp}</p>
                <p>Монеты: ${player.coins}</p>
                <p>Артефакты найдено: ${stats.artifactsFound}</p>
                <p>Мутантов убито: ${stats.mutantsKilled}</p>
                <p>NPC убито: ${stats.npcsKilled}</p>
                <p>Смертей: ${stats.deaths}</p>
                <p>Онлайн игроков убито: ${stats.onlinePlayersKilled}</p>
                <p>Перки: ${JSON.stringify({
                    vitality: player.vitality,
                    agility: player.agility,
                    strength: player.strength,
                    accuracy: player.accuracy,
                    intellect: player.intellect,
                    luck: player.luck
                })}</p>

            </div>
        `;

        fetch(`${SERVER_URL}/api/players`)

                    <div style="background: #1a1a1a; padding: 10px; border-radius: 8px; margin-bottom: 8px;" onclick="showPlayerInfo('${p.id}')">

function openKpkTab(tab) {
    kpkTab = tab;
    renderKpk();
}

function showPlayerInfo(playerId) {
    fetch(`${SERVER_URL}/api/player/${playerId}`)
        .then(res => res.json())
        .then(data => {
            alert(`
                Игрок: ${data.username}
                Уровень: ${data.level}
                Монеты: ${data.coins}
            `);
        });
}

// ===== РЫНОК =====
function renderMarket() {
    const content = document.getElementById('marketContent');
    content.innerHTML = '';
    
    if (marketTab === 'my') {
        fetch(`${SERVER_URL}/api/market`)
            .then(res => res.json())
            .then(lots => {
                const myLots = lots.filter(l => l.seller_id === getPlayerId());
                content.innerHTML = myLots.map(lot => `
                    <div style="background: #1a1a1a; padding: 10px; border-radius: 8px; margin-bottom: 8px;">
                        <p><strong>${lot.item}</strong></p>
                        <p>Цена: ${lot.price} монет</p>
                        <p>Количество: ${lot.quantity}</p>
                    </div>
                `).join('');
            });
    } else if (marketTab === 'buy') {
        fetch(`${SERVER_URL}/api/market`)
            .then(res => res.json())
            .then(lots => {
                const buyableLots = lots.filter(l => l.seller_id !== getPlayerId());
                content.innerHTML = buyableLots.map(lot => `
                    <div style="background: #1a1a1a; padding: 10px; border-radius: 8px; margin-bottom: 8px;">
                        <p><strong>${lot.item}</strong></p>
                        <p>Цена: ${lot.price} монет</p>
                        <p>Количество: ${lot.quantity}</p>
                        <button onclick="buyMarketItem(${lot.id})">Купить</button>
                    </div>
                `).join('');
            });
    }
}

function openMarketTab(tab) {
    marketTab = tab;
    renderMarket();
}

function getPlayerId() {
    const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
    return tgUser ? tgUser.id : 'guest';
}

function buyMarketItem(lotId) {
    const buyerId = getPlayerId();
    
    fetch(`${SERVER_URL}/api/market/buy`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ buyerId, lotId })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            alert('Покупка успешна!');
        } else {
            alert('Ошибка: ' + data.error);
        }
    });
}

// ===== АРЕНА =====
function renderArena() {
    const content = document.getElementById('arenaContent');
    content.innerHTML = '';
    
    fetch(`${SERVER_URL}/api/arena`)
        .then(res => res.json())
        .then(arena => {
            content.innerHTML = arena.map((player, index) => `
                <div style="background: #1a1a1a; padding: 10px; border-radius: 8px; margin-bottom: 8px;">
                    <p><strong>${index + 1}. ${player.player_id}</strong></p>
                    <p>Рейтинг: ${player.rating}</p>
                    <p>Победы: ${player.wins}</p>
                </div>
            `).join('');
        });
}
    // ===== БОЙ =====
    function startBattle(enemy) {
        currentEnemy = enemy;
        battleTurn = 0;
        raidLogs = [];
        raidLogs.push(`⚔️ Бой с ${enemy.name}! Ваш ход.`);
        updateRaidLog();
        renderBattleButtons();
    }

    function renderBattleButtons() {
        const raidScreen = document.getElementById('raidScreen');
        const battleDiv = document.createElement('div');
        battleDiv.id = 'battleButtons';
        battleDiv.style.display = 'grid';
        battleDiv.style.gridTemplateColumns = '1fr 1fr';
        battleDiv.style.gap = '8px';
        battleDiv.style.marginTop = '10px';
        
        if (battleTurn === 0) {
            battleDiv.innerHTML = `
                <button onclick="battleAction('attack')" style="background: #27ae60; border: none; padding: 12px; color: #fff; font-weight: bold; border-radius: 8px;">Атаковать</button>
                <button onclick="battleAction('medkit')" style="background: #2980b9; border: none; padding: 12px; color: #fff; font-weight: bold; border-radius: 8px;">Аптечка</button>
                <button onclick="battleAction('escape')" style="background: #c0392b; border: none; padding: 12px; color: #fff; font-weight: bold; border-radius: 8px;">Сбежать</button>
            `;
        } else {
            battleDiv.innerHTML = `
                <button disabled style="background: #333; border: none; padding: 12px; color: #888; border-radius: 8px;">Ход врага...</button>
            `;
        }
        
        raidScreen.appendChild(battleDiv);
    }

    function battleAction(action) {
        if (!currentEnemy) return;
        
        if (action === 'attack') {
            const dmg = player.weapon.dmg + player.strength;
            currentEnemy.hp -= dmg;
            raidLogs.push(`Вы атаковали! Урон: ${dmg}. У врага ${Math.max(0, currentEnemy.hp)} HP.`);
            player.accuracy += 0.1 * currentEnemy.tier;
        } else if (action === 'medkit') {
            if (player.inventory['Аптечка'] > 0) {
                player.inventory['Аптечка']--;
                player.health = Math.min(player.maxHealth, player.health + 50);
                player.vitality += 0.1;
                player.maxHealth += 0.1;
                raidLogs.push('Вы использовали аптечку! +50 HP.');
            } else {
                raidLogs.push('У вас нет аптечек!');
                return;
            }
        } else if (action === 'escape') {
            const escapeChance = Math.min(1.0, currentEnemy.runChance + player.agility * 0.01);
            if (Math.random() < escapeChance) {
                raidLogs.push('Вы успешно сбежали!');
                player.agility += currentEnemy.runSkill;
                endBattle(false);
                return;
            } else {
                raidLogs.push('Побег не удался!');
            }
        }
        
        if (currentEnemy.hp <= 0) {
            raidLogs.push(`🏆 Победа! Вы получили: ${currentEnemy.coins} монет, ${currentEnemy.exp} EXP, ${currentEnemy.loot}`);
            player.coins += currentEnemy.coins;
            player.exp += currentEnemy.exp;
            player.inventory[currentEnemy.loot] = (player.inventory[currentEnemy.loot] || 0) + 1;
            player.strength += 0.1 * currentEnemy.tier;
            endBattle(true);
            return;
        }
        
        battleTurn = 1;
        renderBattleButtons();
        updateRaidLog();
        
        setTimeout(() => {
            const enemyHitChance = currentEnemy.hitChance;
            if (Math.random() < enemyHitChance) {
                const enemyDmg = currentEnemy.dmg - player.armor.armor;
                const finalDmg = Math.max(0, enemyDmg);
                player.health -= finalDmg;
                raidLogs.push(`${currentEnemy.name} атаковал! Урон: ${finalDmg}. Ваше HP: ${Math.max(0, player.health)}`);
            } else {
                raidLogs.push(`${currentEnemy.name} промахнулся!`);
            }
            
            if (player.health <= 0) {
                raidLogs.push('💀 Вы мертвы...');
                endBattle(false);
                return;
            }
            
            battleTurn = 0;
            renderBattleButtons();
            updateRaidLog();
        }, 1000);
    }

    function endBattle(win) {
        currentEnemy = null;
        battleTurn = 0;
        document.getElementById('battleButtons')?.remove();
        saveGame();
        updateUI();
    }

    function updateRaidLog() {
        document.getElementById('raidLog').textContent = raidLogs.join('\n\n');
    }

    // ===== РЕЙД =====
    function startRaid() {
        raidActive = true;
        raidLogs = [];
        document.getElementById('mainMenu').style.display = 'none';
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('raidScreen').classList.add('active');
        document.getElementById('raidLog').textContent = 'Вы входите в Зону...';
        saveGame();
    }

    function endRaid() {
        raidActive = false;
        currentEnemy = null;
        document.getElementById('battleButtons')?.remove();
        openScreen('main');
        saveGame();
    }

    function raidStep() {
        if (!raidActive) return;
        if (currentEnemy) return;
        
        const npcChance = Math.random();
        
        if (npcChance < 0.3) {
            const npc = findRandomNPC();
            startBattle(npc);
        } else if (npcChance < 0.6) {
            const anomaly = anomalies[Math.floor(Math.random() * anomalies.length)];
            const dmg = anomaly.dmg - player.armor.armor - player.armor.artifactProtection;
            const finalDmg = Math.max(0, dmg);
            
            player.health -= finalDmg;
            
            let eventText = `Аномалия ${anomaly.name}! -${finalDmg} HP`;
            
            if (player.detector.tier >= anomaly.tier) {
                if (Math.random() < 0.5 + player.luck * 0.01) {
                    const artifactName = anomaly.artifacts[Math.floor(Math.random() * anomaly.artifacts.length)];
                    player.inventory[artifactName] = (player.inventory[artifactName] || 0) + 1;
                    eventText += `\nВы нашли артефакт: ${artifactName}!`;
                    player.luck += 0.1 * anomaly.tier;
                }
            } else {
                eventText += `\nДетектор слабоват для этого тира!`;
            }
            
            raidLogs.push(eventText);
        } else if (npcChance < 0.8) {
            const mutationChance = Math.random();
            let chosenMutant = null;
            
            for (let i = mutants.length - 1; i >= 0; i--) {
                if (mutationChance < mutants[i].chance) {
                    chosenMutant = mutants[i];
                    break;
                }
            }
            
            if (!chosenMutant) chosenMutant = mutants[0];
            
            startBattle(chosenMutant);
        } else {
            raidLogs.push('🌫️ Вы ничего не нашли. Тишина...');
        }
        
        if (raidLogs.length > 3) raidLogs.shift();
        
        player.health = Math.max(0, Math.min(player.maxHealth, player.health));
        player.hunger = Math.max(0, Math.min(100, player.hunger));
        player.thirst = Math.max(0, Math.min(100, player.thirst));
        
        while (player.exp >= 150) {
            player.level += 1;
            player.exp = player.exp - 150;
        }
        
        updateUI();
        saveGame();
    }

    // ===== НАЙТИ СЛУЧАЙНЫЙ NPC =====
    function findRandomNPC() {
        const randomIndex = Math.floor(Math.random() * npcs.length);
        return npcs[randomIndex];
    }

    // ===== ВЫХОД ИЗ ИГРЫ =====
    function exitGame() {
        if (confirm('Вы уверены, что хотите выйти?')) {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.close();
            } else {
                alert('Игра сохранена!');
            }
        }
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    loadGame();
</script>
