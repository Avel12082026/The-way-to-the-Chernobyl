name: Build Android APK 0.1.8

on:
  push:
    branches: [android/update-0.1.8-20260923]
    paths:
      - 'index.html'
      - 'android/**'
      - 'mobile/web/**'
      - 'tools/build_mobile.py'
      - 'images/**'
      - 'icons/**'
      - 'audio/**'
      - 'inventory/**'
      - 'ui/**'
      - 'file_000000002bb08210800056ebfb1dce1f.png'
      - '.github/workflows/android-apk-0.1.8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-0.1.8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build local game assets
        run: python3 tools/build_mobile.py --download
      - name: Validate bundled client and launcher
        run: |
          test -f android/app/src/main/assets/asset-manifest.json
          test -f android/app/src/main/assets/ui/trade-menu.js
          test -f android/app/src/main/assets/ui/bunker-menu.js
          test -s android/app/src/main/res/drawable-nodpi/game_icon.webp
          node --check android/app/src/main/assets/ui/trade-menu.js
          node --check android/app/src/main/assets/ui/bunker-menu.js
          grep -Fq "regularArmor.slice(0, 29)" android/app/src/main/assets/ui/trade-menu.js
          grep -Fq "regularArmor.slice(29, 58)" android/app/src/main/assets/ui/trade-menu.js
          grep -Fq 'android:label="The way to the Chernobyl"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:icon="@drawable/game_icon"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@drawable/game_icon"' android/app/src/main/AndroidManifest.xml
      - name: Build unsigned release APK
        run: gradle -p android --no-daemon assembleRelease
      - name: Prepare artifact
        run: |
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-out/The-way-to-the-Chernobyl-0.1.8-unsigned.apk
          sha256sum apk-out/The-way-to-the-Chernobyl-0.1.8-unsigned.apk > apk-out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chernobyl-android-0.1.8-unsigned
          retention-days: 7
          path: apk-out/
