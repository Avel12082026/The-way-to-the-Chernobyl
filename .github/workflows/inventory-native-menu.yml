name: Inventory native menu regression
on:
  push:
    branches: [feature/quests-balance-20260919]
    paths:
      - 'inventory/drag.js'
      - 'inventory/drag.css'
      - 'ui/trader-hubs.css'
      - 'tests/inventory_native_menu.browser.py'
      - '.github/workflows/inventory-native-menu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: python tests/inventory_native_menu.browser.py
