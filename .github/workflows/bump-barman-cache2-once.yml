name: One-time Barman cache bump 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-barman-cache2-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump bunker menu cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='20260926-barman-hub1'
          new='20260926-barman-hub2'
          n=s.count(old)
          if n < 2:
              raise SystemExit(f'expected at least 2 cache refs, found {n}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: bust cache for Barman portrait v2"
          git push origin HEAD:main
