name: Review chat PDA navigation
on:
  push:
    branches: [work/chat-in-pda]
    paths:
      - '.github/workflows/chat-pda-review.yml'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /index.html
            /tools/patch_chat_pda.py
          sparse-checkout-cone-mode: false
      - name: Apply exact reviewed patch
        run: python tools/patch_chat_pda.py index.html
      - name: Verify tested client checksum and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess, tempfile
          data = Path('index.html').read_bytes()
          actual = hashlib.sha256(data).hexdigest()
          expected = '17306f97d562063d14c07a9f8abff52cc6d2e1f69b508eb66698471239227668'
          if actual != expected:
              raise SystemExit('The patched client differs from the browser-tested file: ' + actual)
          text = data.decode('utf-8')
          with tempfile.TemporaryDirectory() as tmp:
              for i, script in enumerate(re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', text)):
                  if script.strip():
                      path = Path(tmp) / f'script-{i}.js'
                      path.write_text(script, encoding='utf-8')
                      subprocess.run(['node', '--check', str(path)], check=True)
          print('PASS: exact browser-tested client, SHA-256', actual)
          PY
      - name: Commit reviewed client on work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move existing chat into PDA Teleg rammka screen'
          git push origin HEAD:work/chat-in-pda
          git rev-parse HEAD > reviewed-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chat-navigation-reviewed
          path: |
            index.html
            reviewed-commit.txt
          retention-days: 3
