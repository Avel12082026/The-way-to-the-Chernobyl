name: Validate raid and PDA five fixes
on:
  push:
    branches: [feature/raid-pda-five-fixes-20260919, fix/raid-no-scroll-dynamic-buttons-20260919]
    paths:
      - 'index.html'
      - 'ui/raid-kpk-polish.*'
      - 'ui/quests.*'
      - 'ui/trader-hubs.*'
      - 'tools/install_public_profile_currencies.py'\n      - 'tools/install_raid_survival_server.py'\n      - 'tests/raid_survival_server_patch.test.py'
      - 'tests/public_profile_currencies.test.py'
      - 'tests/raid_pda_five.static.cjs'
      - 'tests/raid_quickslot.browser.py'
      - 'tests/quests.browser.py'
      - '.github/workflows/raid-pda-five-fixes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          node --check ui/raid-kpk-polish.js
          node --check ui/quests.js
          node --check ui/trader-hubs.js
          python3 -m py_compile tools/install_public_profile_currencies.py tests/public_profile_currencies.test.py tools/install_raid_survival_server.py tests/raid_survival_server_patch.test.py
          node tests/raid_pda_five.static.cjs
          python3 tests/public_profile_currencies.test.py\n          python3 tests/raid_survival_server_patch.test.py
          git diff --check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: python tests/quests.browser.py
      - run: python tests/raid_quickslot.browser.py
