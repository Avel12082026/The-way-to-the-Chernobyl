name: Build Android APK 0.1.5

on:
  push:
    branches: [android/update-0.1.5-20260918]
    paths:
      - 'index.html'
      - 'android/**'
      - 'mobile/web/**'
      - 'tools/build_mobile.py'
      - 'images/**'
      - 'icons/**'
      - 'audio/**'
      - 'inventory/**'
      - 'ui/**'
      - 'file_000000002bb08210800056ebfb1dce1f.png'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-0.1.5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build local game assets
        run: python3 tools/build_mobile.py --download
      - name: Validate bundled client
        run: |
          test -f android/app/src/main/assets/asset-manifest.json
          test -f android/app/src/main/assets/ui/trade-menu.js
          test -f android/app/src/main/assets/ui/trade-menu.css
          test -f android/app/src/main/assets/file_000000002bb08210800056ebfb1dce1f.png
          node --check android/app/src/main/assets/ui/trade-menu.js
          node --check android/app/src/main/assets/inventory/drag.js
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('android/app/src/main/assets/asset-manifest.json')
          d=json.loads(p.read_text())
          assert len(d['files']) > 100
          assert d['totalBytes'] > 1_000_000
          print('Bundled files:',len(d['files']),'bytes:',d['totalBytes'])
          PY
      - name: Build unsigned release APK
        run: gradle -p android --no-daemon assembleRelease
      - name: Prepare artifact
        run: |
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p .apk-out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk .apk-out/The-way-to-the-Chernobyl-0.1.5-unsigned.apk
          sha256sum .apk-out/The-way-to-the-Chernobyl-0.1.5-unsigned.apk > .apk-out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chernobyl-android-0.1.5-unsigned
          retention-days: 7
          path: .apk-out/
