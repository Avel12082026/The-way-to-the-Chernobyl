name: Quest UI browser regression
on:
  push:
    branches: [feature/quests-balance-20260919]
    paths:
      - 'ui/quests.js'
      - 'ui/quests.css'
      - 'ui/balance-tuning.js'
      - 'ui/trader-hubs.js'
      - 'ui/trader-hubs.css'
      - 'tests/quests.browser.py'
      - '.github/workflows/quests-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: python tests/quests.browser.py
