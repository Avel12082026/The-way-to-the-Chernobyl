name: Validate quests and balance
on:
  push:
    branches: [feature/quests-balance-20260919]
    paths:
      - 'inventory/**'
      - 'ui/quests.*'
      - 'ui/balance-tuning.js'
      - 'ui/trader-hubs.*'
      - 'server_patches/quest-balance.cjs'
      - 'tools/install_quest_balance_server.py'
      - 'tests/quests_*'
      - 'tests/inventory_drag.test.cjs'
      - '.github/workflows/quests-balance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Syntax
        run: |
          node --check inventory/drag.js
          node --check ui/quests.js
          node --check ui/balance-tuning.js
          node --check ui/trader-hubs.js
          node --check server_patches/quest-balance.cjs
          python3 -m py_compile tools/install_quest_balance_server.py
      - name: Unit and static checks
        run: |
          node tests/quests_server.test.cjs
          node tests/quests_client.static.cjs
          node tests/inventory_drag.test.cjs
          git diff --check
