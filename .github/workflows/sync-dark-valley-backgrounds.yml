name: Sync Dark Valley backgrounds

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download Dark Valley backgrounds
        run: |
          set -euo pipefail
          mkdir -p images/combat/environments
          for n in 21 22 23 24 25; do
            curl --fail --silent --show-error --retry 3               "https://213-176-92-184.sslip.io/images/combat/environments/$n.webp"               -o "images/combat/environments/$n.webp"
            file "images/combat/environments/$n.webp" | grep -q '1536x1024'
          done

      - name: Enable real Dark Valley backgrounds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('images/combat/environments-v2.js')
          s=p.read_text(encoding='utf-8')
          old="{id:5,slug:'dark-valley',label:'Тёмная долина',placeholder:'images/combat/environments/dark-valley-placeholder.svg',names:"
          new="{id:5,slug:'dark-valley',label:'Тёмная долина',names:"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          elif new not in s:
              raise SystemExit('Dark Valley definition anchor not found')
          PY

      - name: Verify paths
        run: |
          node - <<'NODE'
          const env=require('./images/combat/environments-v2.js');
          const z=env.zones.find(x=>x.id===5);
          if(!z || z.entries.length!==5) throw new Error('Dark Valley must have 5 backgrounds');
          const expected=['21.webp','22.webp','23.webp','24.webp','25.webp'];
          z.entries.forEach((e,i)=>{
            if(!e.path.endsWith(expected[i])) throw new Error('bad path '+e.path);
          });
          console.log(z.entries.map(x=>x.path).join('\n'));
          NODE

      - name: Commit synced assets
        run: |
          set -e
          git add images/combat/environments/21.webp images/combat/environments/22.webp                   images/combat/environments/23.webp images/combat/environments/24.webp                   images/combat/environments/25.webp images/combat/environments-v2.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add five Dark Valley combat backgrounds"
          git push origin HEAD:main
