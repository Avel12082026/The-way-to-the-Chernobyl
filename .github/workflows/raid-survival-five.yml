name: Raid survival five fixes
on:
  push:
    branches: [fix/raid-survival-items-multiquests-20260920]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: raid-survival-five-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Integrate reviewed parallel main without replacing unrelated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import subprocess as sp
          from pathlib import Path
          MAIN='181d1622f73eeeced7b3c49b0b7dc3d2fe978aa4'
          actual=sp.check_output(['git','ls-remote','origin','refs/heads/main'],text=True).split()[0]
          assert actual==MAIN,('Main moved again; manual review required',actual)
          ours=sp.check_output(['git','rev-parse','HEAD'],text=True).strip()
          # These files implement exactly the same feature; retain the reviewed
          # batch/deactivation/hash-guarded superset. New main tests and CSS stay.
          retain={'index.html','server_patches/quest-balance.cjs','ui/quests.js','ui/raid-kpk-polish.css','ui/raid-kpk-polish.js','ui/trader-hubs.js'}
          tests={'tests/quests.browser.py','tests/raid_pda_five.static.cjs'}
          r=sp.run(['git','merge','--no-commit','--no-ff',MAIN])
          unresolved=set(sp.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert unresolved<=retain|tests,('Unreviewed merge conflicts',unresolved)
          for name in sorted(retain):
              sp.run(['git','checkout',ours,'--',name],check=True)
          for name in sorted(tests):
              sp.run(['git','checkout',MAIN,'--',name],check=True)
          assert not sp.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).strip()
          PY
          python3 tools/reconcile_raid_five_review.py
          python3 tools/apply_raid_five_client.py
          git diff --check
          python3 - <<'PY'
          import sys,json,hashlib
          from pathlib import Path
          sys.path.insert(0,'tools')
          from patch_raid_survival import build
          from install_raid_five_update import QUEST_AFTER,MODULE_HASH
          assert hashlib.sha256(Path('server_patches/quest-balance.cjs').read_bytes()).hexdigest()==QUEST_AFTER
          assert hashlib.sha256(Path('server_patches/raid-survival.cjs').read_bytes()).hexdigest()==MODULE_HASH
          f=json.loads(Path('tests/fixtures/raid-survival-live.json').read_text())
          Path('.validation').mkdir(exist_ok=True)
          Path('.validation/raid-survival-fixture.js').write_text(build(f['source']))
          PY
      - name: Syntax, SQLite routes, migration and rollback regressions
        run: |
          node --check server_patches/raid-survival.cjs
          node --check server_patches/quest-balance.cjs
          node --check ui/item-reference.js
          node --check ui/quests.js
          node --check ui/raid-kpk-polish.js
          node --check .validation/raid-survival-fixture.js
          python3 -m py_compile tools/apply_raid_five_client.py tools/patch_raid_survival.py tools/install_raid_five_update.py tests/raid_five.browser.py
          node tests/raid_survival.test.cjs
          node tests/quests_multi.test.cjs
          node tests/item_reference.test.cjs
          python3 tests/raid_five_installer.test.py
          node tests/quests_server.test.cjs
          node tests/quests_client.static.cjs
          node tests/raid_pda_five.static.cjs
          node tests/admin_balance_exclusion.test.cjs
          python3 tests/raid_survival_server_patch.test.py
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0 > /tmp/playwright-install.log 2>&1
          python -m playwright install --with-deps chromium >> /tmp/playwright-install.log 2>&1 || { tail -n 60 /tmp/playwright-install.log; exit 1; }
      - name: Mobile browser regressions
        run: |
          python tests/quests.browser.py
          python tests/raid_quickslot.browser.py
          python tests/raid_five.browser.py
      - name: Attach reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raid-five-validation
          include-hidden-files: true
          retention-days: 7
          path: .validation/raid-five/
      - name: Publish tested integration to this branch only
        if: success() && github.ref == 'refs/heads/fix/raid-survival-items-multiquests-20260920'
        run: |
          git add -u
          git commit -m 'Integrate parallel multi-quest work; preserve radiation rate and strengthen validation'
          git push origin HEAD:fix/raid-survival-items-multiquests-20260920
          git rev-parse HEAD
