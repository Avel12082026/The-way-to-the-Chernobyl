name: Apply soundtrack update
on:
  push:
    paths:
      - '.github/workflows/apply-soundtrack-update.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch soundtrack assets and wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'audio/menu-music.js?v=2' in s:
              s=s.replace('audio/menu-music.js?v=2','audio/menu-music.js?v=3',1)
          elif 'audio/menu-music.js?v=3' not in s:
              raise SystemExit('menu-music cache tag not found')
          p.write_text(s)

          PY

          mkdir -p audio
          rm -f audio/menu-ambient.mp3 audio/radwind-pt1.mp3 audio/dirge-for-the-planet.mp3 audio/meditation.mp3
          base='https://213-176-92-184.sslip.io/audio'
          for i in 01 02 03 04 05 06; do
            curl -fsSL --retry 3 "$base/zone-ambient-$i.mp3" -o "audio/zone-ambient-$i.mp3"
          done
          test "$(stat -c %s audio/zone-ambient-01.mp3)" = "8074261"
          test "$(stat -c %s audio/zone-ambient-02.mp3)" = "8254597"
          test "$(stat -c %s audio/zone-ambient-03.mp3)" = "4696981"
          test "$(stat -c %s audio/zone-ambient-04.mp3)" = "5031541"
          test "$(stat -c %s audio/zone-ambient-05.mp3)" = "8258389"
          test "$(stat -c %s audio/zone-ambient-06.mp3)" = "8101909"
          node tests/background_music.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: replace soundtrack assets with randomized ambient set'
          git push origin HEAD:main
