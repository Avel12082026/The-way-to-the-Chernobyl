name: Validate interaction polish

on:
  push:
    branches: [ui/interaction-notifications-20260918]
    paths:
      - 'ui/trader-hubs.js'
      - 'ui/trader-hubs.css'
      - 'ui/trade-menu.js'
      - 'ui/pda-notification.mp3.b64'
      - 'tests/interaction_polish.static.cjs'
      - '.github/workflows/interaction-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and regression checks
        run: |
          node --check ui/trader-hubs.js
          node --check ui/trade-menu.js
          node tests/interaction_polish.static.cjs
      - name: Refresh cache-busting versions
        run: python tools/bump_interaction_assets.py
      - name: Commit refreshed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh interaction asset cache versions"
            git push origin HEAD:ui/interaction-notifications-20260918
          fi
