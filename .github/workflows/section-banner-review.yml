name: Section banner review
on:
  push:
    branches: [fix/remove-section-banners]
    paths: [.github/workflows/section-banner-review.yml]
permissions:
  contents: write
jobs:
  verify-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser test driver
        run: python3 -m pip install playwright==1.55.0
      - name: Fetch guarded cleanup script
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          url = 'https://raw.githubusercontent.com/Avel12082026/The-way-to-the-Chernobyl/' + os.environ['SOURCE_SHA'] + '/tools/prepare_section_banner_cleanup.py'
          with urllib.request.urlopen(url, timeout=40) as response:
              content = response.read()
          open('prepare.py', 'wb').write(content)
          PY
      - name: Check both clients and prepare commits without moving branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 prepare.py
      - name: Save tested source and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section-banner-cleanup
          path: validation/
          retention-days: 7
          if-no-files-found: error
