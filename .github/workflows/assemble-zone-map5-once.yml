name: Assemble Dark Valley map once

on:
  push:
    branches: [main]
    paths:
      - 'ui/zone-map5-b64/**'
      - '.github/workflows/assemble-zone-map5-once.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync branch
        run: git pull --rebase origin main
      - name: Assemble exact PNG
        run: |
          cat ui/zone-map5-b64/part-*.b64 > /tmp/zone-map5.b64
          base64 -d /tmp/zone-map5.b64 > ui/zone-map5.png
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('ui/zone-map5.png')
          b=p.read_bytes()
          assert hashlib.sha256(b).hexdigest()=='c33cb6e2095b23067f48e494f95405a26145191635ae4d2c0f25a721616229c9'
          assert len(b)==3559503
          assert b[:8]==b'\x89PNG\r\n\x1a\n' and b[12:16]==b'IHDR'
          assert int.from_bytes(b[16:20],'big')==941
          assert int.from_bytes(b[20:24],'big')==1672
          print('DARK_VALLEY_MAP_EXACT=PASS')
          PY
      - name: Commit binary and remove temporary chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/zone-map5.png
          git rm -r ui/zone-map5-b64 .github/workflows/assemble-zone-map5-once.yml
          git commit -m "assets: add exact Dark Valley map"
          git push origin HEAD:main
