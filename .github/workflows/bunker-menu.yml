name: Inspect shared trader hooks

on:
  push:
    branches: [ui/bunker-menu-20260917]
    paths:
      - '.github/workflows/bunker-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Print exact trader implementations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          patterns=[
            'function openTechnicianTab','function renderTechnician','sellToServer(\'technician\'','sellToServer("technician"','diesel',
            'function renderFriendlyTrade','function openFriendly','friendlyTrade','friendlyScreen','/api/friendly/buy',
            'let shopTab','var shopTab','const shopTab','function getShopCatalog','function depositToWarehouse','function renderWarehouse','warehouseInventoryGrid'
          ]
          for pat in patterns:
            print('\n===== '+pat+' =====')
            hits=[m.start() for m in re.finditer(re.escape(pat),text,re.I)]
            print('hits',len(hits))
            for pos in hits[:12]:
              a=max(0,pos-1600); b=min(len(text),pos+4200)
              print(text[a:b].replace('\n',' '))
              print('\n---')
          PY
