name: Validate Telegram bunker menu

on:
  push:
    branches: [ui/bunker-menu-20260917]
    paths:
      - 'ui/bunker-menu.*'
      - 'tools/install_bunker_menu.py'
      - 'tests/bunker_menu.browser.py'
      - 'tests/leonov_modes.browser.py'
      - 'tests/leonov_requirements.test.cjs'
      - '.github/workflows/bunker-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bunker-menu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/ui/bunker-menu-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Inspect existing trader hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          patterns=[
            'id="shopScreen"','id="technicianScreen"','id="scientistsScreen"','id="warehouseScreen"',
            'openScientistsBuyView','openScientistsSellView','openScreen(\'shop\')','openScreen(\'technician\')',
            'function renderShop','function openShop','function buy','function sell','/shop','/trade','technician','ЖУЧАРА','ДИЗЕЛЬ'
          ]
          for pat in patterns:
            print('\n===== '+pat+' =====')
            hits=[m.start() for m in re.finditer(re.escape(pat),text,re.I)]
            print('hits',len(hits))
            for pos in hits[:8]:
              a=max(0,pos-900); b=min(len(text),pos+1800)
              print(text[a:b].replace('\n',' '))
              print('\n---')
          PY
      - name: Install Telegram menu with guarded anchors
        run: python tools/install_bunker_menu.py
      - name: Verify JavaScript and preserved PDA chat
        run: |
          node --check ui/bunker-menu.js
          node tests/chat_pda_structure.cjs
          node tests/leonov_requirements.test.cjs
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test Leonov modes without live player writes
        run: python tests/leonov_modes.browser.py
      - name: Attach screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunker-menu-validation
          path: |
            .validation/bunker-menu/
            .validation/leonov-modes/
          retention-days: 7
      - name: Commit validated client to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Install validated interactive Telegram bunker main menu"
            git push origin HEAD:ui/bunker-menu-20260917
          fi
