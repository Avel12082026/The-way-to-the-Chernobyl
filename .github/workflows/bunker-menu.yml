name: Validate shared NPC trade workspace

on:
  push:
    branches: [ui/bunker-menu-20260917]
    paths:
      - 'ui/bunker-menu.*'
      - 'ui/trade-menu.*'
      - 'ui/trade-bridge.js'
      - 'tools/install_bunker_menu.py'
      - 'tests/shared_trade_requirements.test.cjs'
      - 'tests/shared_trade.browser.py'
      - 'tests/chat_pda_structure.cjs'
      - 'tests/leonov_requirements.test.cjs'
      - '.github/workflows/bunker-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-trade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Install current Telegram UI
        run: python tools/install_bunker_menu.py
      - name: Static safety checks
        run: |
          node --check ui/bunker-menu.js
          node --check ui/trade-menu.js
          node --check ui/trade-bridge.js
          node tests/chat_pda_structure.cjs
          node tests/leonov_requirements.test.cjs
          node tests/shared_trade_requirements.test.cjs
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('ui/trade-menu.css?v=1') == 1
          assert s.count('ui/trade-menu.js?v=1') == 1
          assert s.count('ui/trade-bridge.js?v=1') == 1
          print('Installed trade assets: OK')
          PY
      - name: Install browser dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test shared trade UI without live player writes
        run: python tests/shared_trade.browser.py
      - name: Attach trade screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-trade-validation
          path: .validation/shared-trade/
          retention-days: 7
      - name: Commit validated client to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Install validated shared NPC trade workspace"
            git push origin HEAD:ui/bunker-menu-20260917
          fi
