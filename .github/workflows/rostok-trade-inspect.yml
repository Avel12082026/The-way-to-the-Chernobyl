name: Rostok and trade inspection
on:
  push:
    branches: [fix/rostok-hud-trade-20260925]
    paths: ['.github/workflows/rostok-trade-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read-only bar image
        run: |
          mkdir -p artwork-out
          curl --fail --silent --show-error --retry 1 --max-time 25 https://213-176-92-184.sslip.io/api/zone-camp/4 -o artwork-out/rostok-bar.png
          sha256sum artwork-out/rostok-bar.png
      - uses: actions/upload-artifact@v4
        with:
          name: rostok-bar-readonly-20260925
          retention-days: 3
          path: artwork-out/
