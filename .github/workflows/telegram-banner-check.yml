name: Verify published Telegram banner cleanup
on:
  push:
    branches: [fix/telegram-section-banners]
    paths:
      - .github/workflows/telegram-banner-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: caf27e02aeb612efc25be244a1a83184111aba7d
          fetch-depth: 2
          sparse-checkout: |
            index.html
            tests/section_banners.test.py
            UI_SECTION_BANNERS_STATUS.md
          sparse-checkout-cone-mode: false
      - name: Check the actual current main revision and unchanged functional HTML
        run: |
          python3 tests/section_banners.test.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess, tempfile
          data = Path('index.html').read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert sha == '526e43e9211c7e6529e753b7b3322e415e8c6f3a', sha
          previous = subprocess.check_output(['git', 'show', 'HEAD^:index.html']).decode('utf-8')
          current = data.decode('utf-8')
          without_styles = lambda text: re.sub(r'<style\b[^>]*>.*?</style>', '', text, flags=re.I|re.S)
          assert without_styles(current).split() == without_styles(previous).split()
          scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', current, re.I|re.S)
          old_scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', previous, re.I|re.S)
          assert scripts == old_scripts
          with tempfile.TemporaryDirectory() as directory:
              for number, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  path = Path(directory) / f'inline-{number}.js'
                  path.write_text(script)
                  subprocess.run(['node', '--check', str(path)], check=True)
          print('Main revision verified. Functional markup and JavaScript are unchanged.')
          PY
      - name: Verify the public Telegram client, including the normal URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, time, urllib.request
          expected = Path('index.html').read_bytes()
          expected_hash = hashlib.sha256(expected).hexdigest()
          base = 'https://avel12082026.github.io/The-way-to-the-Chernobyl/'
          results = []
          for suffix in ('', '?ui=section-banner-cleanup-caf27e0'):
              url = base + suffix
              for attempt in range(18):
                  try:
                      request = urllib.request.Request(url, headers={'Cache-Control':'no-cache','User-Agent':'Telegram-banner-deployment-check'})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          actual = response.read()
                          status = response.status
                      actual_hash = hashlib.sha256(actual).hexdigest()
                      if actual_hash == expected_hash:
                          results.append({'url':url,'status':status,'sha256':actual_hash,'bytes':len(actual)})
                          Path('published-telegram.html').write_bytes(actual)
                          break
                      print('Waiting for Pages publication:', actual_hash, flush=True)
                  except Exception as error:
                      print('Fetch retry:', str(error), flush=True)
                  time.sleep(5)
              else:
                  raise RuntimeError('Published Telegram HTML did not match the reviewed main revision')
          report={'status':'passed','commit':'caf27e02aeb612efc25be244a1a83184111aba7d','checks':results,'apk_built':False,'main_modified_by_this_job':False}
          Path('telegram-live-verification.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-published-banner-verification
          path: |
            index.html
            published-telegram.html
            telegram-live-verification.json
            tests/section_banners.test.py
          retention-days: 3
          if-no-files-found: error
