name: One-time Agroprom map cache bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-agroprom-map-cache-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Agroprom map client cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'ui/bunker-menu.css?v=20260926-svalka-map-hq1':'ui/bunker-menu.css?v=20260926-agroprom-map-hq1',
            'ui/bunker-menu.js?v=20260926-svalka-map-hq1':'ui/bunker-menu.js?v=20260926-agroprom-map-hq1',
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit(f'missing cache ref: {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: bust cache for Agroprom HQ map"
          git push origin HEAD:main
