<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Путь к Чернобылю</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#30382a,#101510 65%);color:#e9e5d5;font:16px system-ui;display:grid;place-items:center;padding:24px}main{width:min(100%,400px)}h1{font-size:34px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}p{color:#b1b9a6;line-height:1.5}label{display:block;margin:18px 0 6px}input,button{width:100%;padding:14px;border-radius:6px;border:1px solid #586348;font:inherit}input{background:#171e17;color:#fff}button{margin-top:20px;background:#bacb78;color:#15200f;font-weight:700}button:disabled{opacity:.5}.secondary{background:transparent;color:#d4ddb6}#error{color:#ffbfac;min-height:24px}small{color:#b1b9a6;display:block;line-height:1.5}
</style><script src="session.js"></script></head><body><main><small>ЛИЧНЫЙ КПК · ВХОД В ЗОНУ</small><h1>Путь к Чернобылю</h1><p id="intro">Войди в свой игровой профиль.</p><form id="auth"><label for="login">Логин</label><input id="login" autocomplete="username" pattern="[A-Za-z0-9_]{3,32}" minlength="3" maxlength="32" required autocapitalize="none" spellcheck="false"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required><button id="submit">Войти</button></form><p id="error" role="alert"></p><button class="secondary" id="mode">Создать новый профиль</button><p>Уже играл в Telegram? Сначала открой там КПК → «Вход в Android» и задай логин и пароль. Твой персонаж и вещи сохранятся.</p><small>Картинки и музыка установлены вместе с приложением. Для игры требуется соединение с сервером.</small></main><script>
let mode='login';const toggle=document.getElementById('mode'),submit=document.getElementById('submit'),error=document.getElementById('error');
toggle.onclick=()=>{mode=mode==='login'?'register':'login';submit.textContent=mode==='login'?'Войти':'Зарегистрироваться';toggle.textContent=mode==='login'?'Создать новый профиль':'У меня уже есть профиль';document.getElementById('password').autocomplete=mode==='login'?'current-password':'new-password';error.textContent='';};
document.getElementById('auth').onsubmit=async e=>{e.preventDefault();submit.disabled=toggle.disabled=true;error.textContent='';try{await GameSession.authenticate(mode,document.getElementById('login').value,document.getElementById('password').value);}catch(e){error.textContent=e.name==='AbortError'?'Сервер не ответил. Проверь соединение и повтори вход.':e.message;}finally{submit.disabled=toggle.disabled=false;}};
</script></body></html>
